name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-and-secret-audit:
    name: Dependency and secret audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        shell: bash
        run: |
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          canary_root="${RUNNER_TEMP}/gitleaks-canary"
          mkdir -p "${canary_root}/packages/catalog/src"
          cp .gitleaks.toml "${canary_root}/.gitleaks.toml"
          printf '%s%s\n%s\n%s%s\n' \
            '-----BEGIN PRIVATE ' \
            'KEY-----' \
            'MIIBVwIBADANBgkqhkiG9w0BAQEFAASCAT8wggE7AgEAAkEAuSyntheticCanaryOnly' \
            '-----END PRIVATE ' \
            'KEY-----' \
            > "${canary_root}/packages/catalog/src/models.json"
          set +e
          "${RUNNER_TEMP}/gitleaks" dir "${canary_root}" \
            --config "${canary_root}/.gitleaks.toml" \
            --redact \
            --no-banner \
            --no-color
          canary_status=$?
          set -e
          if [[ "${canary_status}" -ne 1 ]]; then
            echo "::error::Gitleaks detector-scope canary returned ${canary_status}; expected one finding"
            exit 1
          fi
          "${RUNNER_TEMP}/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --no-color
      - uses: ./.github/actions/bun-install
      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=high
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/omp-rpc/pyproject.toml
            python/robomp/pyproject.toml
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip install --disable-pip-version-check -e python/omp-rpc
          python -m pip install --disable-pip-version-check -e "python/robomp[dev]"
          python -m pip_audit --skip-editable --progress-spinner off
      - name: Install Rust audit tools
        run: |
          cargo +stable install cargo-audit --version 0.22.2 --locked
          cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust dependencies and policy
        run: |
          cargo +stable audit
          cargo +stable deny check

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
