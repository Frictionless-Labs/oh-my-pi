name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OMP_TEST_TIMEOUT: "120"

jobs:
  quality:
    name: Quality and tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-install
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/omp-rpc/pyproject.toml
            python/robomp/pyproject.toml
      - name: Install Python packages
        run: |
          python -m pip install --disable-pip-version-check -e python/omp-rpc
          python -m pip install --disable-pip-version-check -e "python/robomp[dev]" "ruff==0.13.3"
      - name: Build native addon
        run: bun --cwd=packages/natives run build
      - name: Static checks
        run: bun check
      - name: TypeScript tests
        run: bun run ci:test:ts
      - name: Release script tests
        run: bun run test:scripts
      - name: Python tests and lint
        run: |
          bun run test:py
          bun run lint:py
      - name: Generated configuration checks
        run: |
          go install github.com/bazelbuild/bazelisk@v1.29.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          bun scripts/gen-bazel-lock.ts --check
          bun scripts/gen-clippy-bazelrc.ts --check
          git diff --check

  smoke:
    name: Runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-install
      - name: Build native addon
        run: bun --cwd=packages/natives run build
      - name: Exercise CLI worker hosts
        run: bun run ci:test:smoke
      - name: Exercise macOS production launcher faults
        if: runner.os == 'macOS'
        run: bun test scripts/production-readiness/Open-Pi.test.ts

  install_methods:
    name: Install methods (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-install
      - name: Exercise binary, source, and tarball installs
        run: bun run ci:test:install-methods

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.146 --locked
      - name: Run Rust tests and doctests
        run: bun run test:rs
